<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tarima — vinilo naciente, 9 variantes</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--fg:#ececE6;--lime:#c6ff3a;--dim:#9fcf2a;--ink:#0a0a0b}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1b1b1d;font-family:Archivo;display:flex;flex-wrap:wrap;gap:24px;padding:24px;justify-content:center}
.tile{width:512px;height:512px;border-radius:116px;overflow:hidden;position:relative;
  background:radial-gradient(140% 140% at 30% 20%, #16170f 0%, #0a0a0b 55%);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.tile.limebg{background:#c6ff3a}
.tile .num{position:absolute;top:18px;left:26px;color:#555;font:700 20px 'JetBrains Mono';z-index:9}
.limebg .num{color:rgba(10,10,11,.4)}
svg{display:block}
</style>
</head>
<body>

<!-- 1 ORIGINAL, ahora visible: cuerpo más claro + surcos marcados -->
<div class="tile" id="l1"><span class="num">1</span>
  <svg width="400" height="400" viewBox="0 0 400 400">
    <defs><clipPath id="h1"><rect x="0" y="60" width="400" height="208"/></clipPath></defs>
    <g clip-path="url(#h1)">
      <circle cx="200" cy="268" r="150" fill="#222226" stroke="#4a4a52" stroke-width="4"/>
      <circle cx="200" cy="268" r="118" fill="none" stroke="#46464e" stroke-width="4"/>
      <circle cx="200" cy="268" r="88" fill="none" stroke="#46464e" stroke-width="4"/>
      <circle cx="200" cy="268" r="54" fill="#c6ff3a"/>
      <circle cx="200" cy="268" r="8" fill="#0a0a0b"/>
      <path d="M92 184 a150 150 0 0 1 64 -52" fill="none" stroke="#6c6c74" stroke-width="11" stroke-linecap="round"/>
    </g>
    <rect x="40" y="268" width="320" height="18" rx="9" fill="#c6ff3a"/>
    <text x="200" y="345" text-anchor="middle" fill="#ececE6" font-family="Anton" font-size="56" letter-spacing="4">TARIMA</text>
  </svg>
</div>

<!-- 2 VINILO LIMA (disco lima, surcos oscuros) -->
<div class="tile" id="l2"><span class="num">2</span>
  <svg width="400" height="400" viewBox="0 0 400 400">
    <defs><clipPath id="h2"><rect x="0" y="60" width="400" height="208"/></clipPath></defs>
    <g clip-path="url(#h2)">
      <circle cx="200" cy="268" r="150" fill="#c6ff3a"/>
      <circle cx="200" cy="268" r="118" fill="none" stroke="rgba(10,10,11,.4)" stroke-width="5"/>
      <circle cx="200" cy="268" r="88" fill="none" stroke="rgba(10,10,11,.4)" stroke-width="5"/>
      <circle cx="200" cy="268" r="54" fill="#0a0a0b"/>
      <circle cx="200" cy="268" r="8" fill="#c6ff3a"/>
    </g>
    <rect x="40" y="268" width="320" height="18" rx="9" fill="#ececE6"/>
    <text x="200" y="345" text-anchor="middle" fill="#ececE6" font-family="Anton" font-size="56" letter-spacing="4">TARIMA</text>
  </svg>
</div>

<!-- 3 AMANECER (halo + rayos) -->
<div class="tile" id="l3"><span class="num">3</span>
  <svg width="400" height="400" viewBox="0 0 400 400">
    <defs>
      <clipPath id="h3"><rect x="0" y="40" width="400" height="228"/></clipPath>
      <radialGradient id="glow" cx="50%" cy="100%" r="80%">
        <stop offset="0%" stop-color="rgba(198,255,58,.35)"/><stop offset="70%" stop-color="rgba(198,255,58,0)"/>
      </radialGradient>
    </defs>
    <rect x="0" y="40" width="400" height="228" fill="url(#glow)"/>
    <g clip-path="url(#h3)">
      <circle cx="200" cy="268" r="130" fill="#222226" stroke="#4a4a52" stroke-width="4"/>
      <circle cx="200" cy="268" r="100" fill="none" stroke="#46464e" stroke-width="4"/>
      <circle cx="200" cy="268" r="72" fill="none" stroke="#46464e" stroke-width="4"/>
      <circle cx="200" cy="268" r="44" fill="#c6ff3a"/>
      <circle cx="200" cy="268" r="7" fill="#0a0a0b"/>
    </g>
    <g stroke="#c6ff3a" stroke-width="14" stroke-linecap="round" fill="none">
      <line x1="200" y1="100" x2="200" y2="56"/>
      <line x1="122" y1="128" x2="94" y2="96"/>
      <line x1="278" y1="128" x2="306" y2="96"/>
      <line x1="76" y1="196" x2="36" y2="180"/>
      <line x1="324" y1="196" x2="364" y2="180"/>
    </g>
    <rect x="40" y="268" width="320" height="18" rx="9" fill="#c6ff3a"/>
    <text x="200" y="345" text-anchor="middle" fill="#ececE6" font-family="Anton" font-size="56" letter-spacing="4">TARIMA</text>
  </svg>
</div>

<!-- 4 CONTORNO (línea blanca + surcos lima, mínimo) -->
<div class="tile" id="l4"><span class="num">4</span>
  <svg width="400" height="400" viewBox="0 0 400 400">
    <defs><clipPath id="h4"><rect x="0" y="60" width="400" height="208"/></clipPath></defs>
    <g clip-path="url(#h4)" fill="none" stroke-linecap="round">
      <circle cx="200" cy="268" r="146" stroke="#ececE6" stroke-width="14"/>
      <circle cx="200" cy="268" r="106" stroke="#c6ff3a" stroke-width="8"/>
      <circle cx="200" cy="268" r="70" stroke="#c6ff3a" stroke-width="8"/>
      <circle cx="200" cy="268" r="34" stroke="#c6ff3a" stroke-width="8"/>
    </g>
    <rect x="40" y="268" width="320" height="16" rx="8" fill="#ececE6"/>
    <text x="200" y="344" text-anchor="middle" fill="#ececE6" font-family="Anton" font-size="56" letter-spacing="4">TARIMA</text>
  </svg>
</div>

<!-- 5 SOBRE LIMA (fondo lima, vinilo negro = máximo contraste) -->
<div class="tile limebg" id="l5"><span class="num">5</span>
  <svg width="400" height="400" viewBox="0 0 400 400">
    <defs><clipPath id="h5"><rect x="0" y="60" width="400" height="208"/></clipPath></defs>
    <g clip-path="url(#h5)">
      <circle cx="200" cy="268" r="150" fill="#0a0a0b"/>
      <circle cx="200" cy="268" r="116" fill="none" stroke="rgba(236,236,230,.25)" stroke-width="5"/>
      <circle cx="200" cy="268" r="84" fill="none" stroke="rgba(236,236,230,.25)" stroke-width="5"/>
      <circle cx="200" cy="268" r="52" fill="#ececE6"/>
      <circle cx="200" cy="268" r="8" fill="#0a0a0b"/>
    </g>
    <rect x="40" y="268" width="320" height="18" rx="9" fill="#0a0a0b"/>
    <text x="200" y="345" text-anchor="middle" fill="#0a0a0b" font-family="Anton" font-size="56" letter-spacing="4">TARIMA</text>
  </svg>
</div>

<!-- 6 DETRÁS DEL WORDMARK (vinilo asoma detrás del texto gigante) -->
<div class="tile" id="l6"><span class="num">6</span>
  <svg width="460" height="460" viewBox="0 0 460 460">
    <defs><clipPath id="h6"><rect x="0" y="60" width="460" height="220"/></clipPath></defs>
    <g clip-path="url(#h6)">
      <circle cx="230" cy="280" r="155" fill="#26262b" stroke="#50505a" stroke-width="4"/>
      <circle cx="230" cy="280" r="118" fill="none" stroke="#4a4a54" stroke-width="4"/>
      <circle cx="230" cy="280" r="84" fill="none" stroke="#4a4a54" stroke-width="4"/>
      <circle cx="230" cy="280" r="50" fill="#c6ff3a"/>
      <circle cx="230" cy="280" r="8" fill="#0a0a0b"/>
    </g>
    <!-- wordmark ON the horizon, stage bar under it -->
    <text x="230" y="306" text-anchor="middle" fill="#ececE6" font-family="Anton" font-size="104" letter-spacing="2">TARIMA</text>
    <rect x="44" y="324" width="372" height="16" rx="8" fill="#c6ff3a"/>
    <text x="230" y="392" text-anchor="middle" fill="#7e7e78" font-family="JetBrains Mono" font-weight="700" font-size="20" letter-spacing="5">DONDE NACE EL FREESTYLE</text>
  </svg>
</div>

<!-- 7 INSIGNIA CIRCULAR (badge con texto arriba) -->
<div class="tile" id="l7"><span class="num">7</span>
  <svg width="430" height="430" viewBox="0 0 430 430">
    <defs>
      <clipPath id="h7"><rect x="75" y="130" width="280" height="96"/></clipPath>
      <path id="arcTop" d="M76 215 a139 139 0 0 1 278 0" fill="none"/>
    </defs>
    <circle cx="215" cy="215" r="172" fill="none" stroke="#ececE6" stroke-width="10"/>
    <text fill="#c6ff3a" font-family="JetBrains Mono" font-weight="700" font-size="21" letter-spacing="2">
      <textPath href="#arcTop" startOffset="50%" text-anchor="middle">DONDE NACE EL FREESTYLE</textPath>
    </text>
    <g clip-path="url(#h7)">
      <circle cx="215" cy="226" r="92" fill="#222226" stroke="#4a4a52" stroke-width="3"/>
      <circle cx="215" cy="226" r="68" fill="none" stroke="#46464e" stroke-width="3"/>
      <circle cx="215" cy="226" r="44" fill="none" stroke="#46464e" stroke-width="3"/>
      <circle cx="215" cy="226" r="26" fill="#c6ff3a"/>
    </g>
    <rect x="112" y="226" width="206" height="12" rx="6" fill="#c6ff3a"/>
    <text x="215" y="290" text-anchor="middle" fill="#ececE6" font-family="Anton" font-size="46" letter-spacing="3">TARIMA</text>
    <text x="215" y="332" text-anchor="middle" fill="#7e7e78" font-family="JetBrains Mono" font-weight="700" font-size="20" letter-spacing="6">EST. 2026</text>
  </svg>
</div>

<!-- 8 MEDIO VINILO ICONO (sin texto — versión app icon) -->
<div class="tile" id="l8"><span class="num">8</span>
  <svg width="420" height="420" viewBox="0 0 420 420">
    <defs><clipPath id="h8"><rect x="0" y="40" width="420" height="190"/></clipPath></defs>
    <g clip-path="url(#h8)">
      <circle cx="210" cy="230" r="168" fill="#26262b" stroke="#52525c" stroke-width="5"/>
      <circle cx="210" cy="230" r="128" fill="none" stroke="#4c4c56" stroke-width="5"/>
      <circle cx="210" cy="230" r="92" fill="none" stroke="#4c4c56" stroke-width="5"/>
      <circle cx="210" cy="230" r="58" fill="#c6ff3a"/>
      <circle cx="210" cy="230" r="9" fill="#0a0a0b"/>
      <path d="M88 134 a168 168 0 0 1 70 -56" fill="none" stroke="#74747e" stroke-width="13" stroke-linecap="round"/>
    </g>
    <rect x="30" y="230" width="360" height="22" rx="11" fill="#c6ff3a"/>
    <!-- eco de surcos bajo el escenario -->
    <g stroke="#3a3a40" stroke-width="5" fill="none" opacity=".8">
      <path d="M86 282 a168 60 0 0 0 248 0"/>
      <path d="M122 282 a128 44 0 0 0 176 0"/>
      <path d="M154 282 a92 30 0 0 0 112 0"/>
    </g>
  </svg>
</div>

<!-- 9 PÚA NACIENTE (vinilo + brazo entrando, momento de empezar) -->
<div class="tile" id="l9"><span class="num">9</span>
  <svg width="400" height="400" viewBox="0 0 400 400">
    <defs><clipPath id="h9"><rect x="0" y="60" width="400" height="208"/></clipPath></defs>
    <g clip-path="url(#h9)">
      <circle cx="186" cy="268" r="146" fill="#222226" stroke="#4a4a52" stroke-width="4"/>
      <circle cx="186" cy="268" r="112" fill="none" stroke="#46464e" stroke-width="4"/>
      <circle cx="186" cy="268" r="82" fill="none" stroke="#46464e" stroke-width="4"/>
      <circle cx="186" cy="268" r="50" fill="#c6ff3a"/>
      <circle cx="186" cy="268" r="8" fill="#0a0a0b"/>
    </g>
    <!-- tonearm dropping onto the rising record -->
    <circle cx="338" cy="84" r="18" fill="#ececE6"/>
    <line x1="338" y1="84" x2="284" y2="180" stroke="#ececE6" stroke-width="11" stroke-linecap="round"/>
    <line x1="284" y1="180" x2="262" y2="202" stroke="#ececE6" stroke-width="11" stroke-linecap="round"/>
    <rect x="246" y="196" width="32" height="18" rx="6" fill="#c6ff3a" transform="rotate(-42 262 205)"/>
    <rect x="40" y="268" width="320" height="18" rx="9" fill="#c6ff3a"/>
    <text x="200" y="345" text-anchor="middle" fill="#ececE6" font-family="Anton" font-size="56" letter-spacing="4">TARIMA</text>
  </svg>
</div>

</body>
</html>
