<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Brand placeholder. Wordmark over the brand gradient. Replace with the
       real logo before App Store submission — Apple requires PNG @ 1024,
       so we'll also need an exported raster set (icon-192.png, icon-512.png,
       icon-1024.png). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b10"/>
      <stop offset="100%" stop-color="#1a0b1f"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d95"/>
      <stop offset="100%" stop-color="#ffb000"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <text x="256" y="312"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="900"
        font-size="168"
        letter-spacing="-4"
        text-anchor="middle"
        fill="url(#text)">T</text>
  <circle cx="256" cy="408" r="14" fill="#ff2d95"/>
</svg>
