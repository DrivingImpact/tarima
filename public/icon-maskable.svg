<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable / full-bleed variant: mark kept inside the 80% safe zone so
       Android's adaptive mask (and iOS rounding) never crop the T. -->
  <defs>
    <radialGradient id="glowm" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#c6ff3a" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#c6ff3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#0a0a0b"/>
  <rect width="512" height="512" fill="url(#glowm)"/>
  <g fill="#c6ff3a">
    <rect x="156" y="176" width="200" height="46" rx="10"/>
    <rect x="233" y="176" width="46" height="170" rx="10"/>
  </g>
  <rect x="176" y="372" width="160" height="8" rx="4" fill="#c6ff3a" fill-opacity="0.55"/>
</svg>
