<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable variant: keeps the wordmark inside the 80% safe zone so
       Android's adaptive-icon mask doesn't crop the T. The background
       extends to the edges. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b10"/>
      <stop offset="100%" stop-color="#1a0b1f"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d95"/>
      <stop offset="100%" stop-color="#ffb000"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <text x="256" y="296"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="900"
        font-size="128"
        letter-spacing="-3"
        text-anchor="middle"
        fill="url(#text)">T</text>
  <circle cx="256" cy="368" r="10" fill="#ff2d95"/>
</svg>
