<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tarima app icon — "Acid Underground". Graphite stage, acid-lime mark.
       The T is drawn as geometry (no font dependency) so it rasterises
       identically everywhere. The lime rule under it reads as the stage
       (la tarima). -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="12%" r="75%">
      <stop offset="0%" stop-color="#c6ff3a" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#c6ff3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0a0a0b"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <g fill="#c6ff3a">
    <rect x="132" y="150" width="248" height="54" rx="12"/>
    <rect x="229" y="150" width="54" height="212" rx="12"/>
  </g>
  <rect x="150" y="392" width="212" height="10" rx="5" fill="#c6ff3a" fill-opacity="0.55"/>
</svg>
